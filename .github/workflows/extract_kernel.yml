name: Extract Kernel and Modules (Air)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full cpio lz4
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
          sudo cp payload-dumper-go /usr/local/bin/
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip 'lib/x86_64/libmagiskboot.so'
          sudo mv lib/x86_64/libmagiskboot.so /usr/local/bin/magiskboot
          sudo chmod +x /usr/local/bin/magiskboot

      - name: Fast Download ROM
        run: |
          aria2c -x 16 -s 16 -k 1M --file-allocation=none -o rom.zip "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global-ota_full-OS2.0.208.0.VGQINXM-user-15.0-93391672cc.zip"
          unzip -q rom.zip payload.bin

      - name: Dump Partitions & Extract Kernel + Modules
        run: |  
          # Added 'vendor' to the dump list to grab the firmware
          payload-dumper-go -o dumped_images -p boot,dtbo,vendor_boot,vendor_dlkm,vendor payload.bin  
          
          mkdir -p prebuilt
          cp dumped_images/dtbo.img prebuilt/dtbo.img || true
          
          cd dumped_images
          echo "1. Unpacking Boot for Kernel..."
          magiskboot unpack boot.img
          cp kernel ../prebuilt/kernel || true
          
          echo "2. Creating Module and Firmware Directories..."
          mkdir -p ../../recovery/root/vendor/lib/modules/1.1
          mkdir -p ../../recovery/root/vendor/firmware
          
          echo "3. Ripping Modules from vendor_dlkm..."
          sudo mkdir -p /mnt/vendor_dlkm
          sudo mount -o ro -t erofs vendor_dlkm.img /mnt/vendor_dlkm || sudo mount -o ro -t ext4 vendor_dlkm.img /mnt/vendor_dlkm || true
          find /mnt/vendor_dlkm -type f -name "*.ko" -exec cp {} ../../recovery/root/vendor/lib/modules/ \;
          find /mnt/vendor_dlkm -type f -name "modules.load*" -exec cp {} ../../recovery/root/vendor/lib/modules/ \;
          sudo umount /mnt/vendor_dlkm || true
          
          # Clone modules into the 1.1 folder just to be safe
          cp ../../recovery/root/vendor/lib/modules/*.ko ../../recovery/root/vendor/lib/modules/1.1/ 2>/dev/null || true
          cp ../../recovery/root/vendor/lib/modules/modules.load* ../../recovery/root/vendor/lib/modules/1.1/ 2>/dev/null || true
          
          echo "4. Ripping Firmware from vendor.img..."
          sudo mkdir -p /mnt/vendor
          sudo mount -o ro -t erofs vendor.img /mnt/vendor || sudo mount -o ro -t ext4 vendor.img /mnt/vendor || true
          # Aggressive search for all touchscreen firmware files
          find /mnt/vendor/firmware -type f | grep -iE 'ts_|touch|focal|novatek|goodix|omnivision|synaptics|truly|boe' | grep -iE '\.bin$|\.img$|\.fw$|\.ini$' | xargs -I {} cp {} ../../recovery/root/vendor/firmware/ || true
          sudo umount /mnt/vendor || true
          
          cd ../../

      - name: Commit Prebuilts and Modules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt/
          git add recovery/root/vendor/lib/modules/
          git add recovery/root/vendor/firmware/
          git commit -m "🦊 Auto-commit: Extracted HyperOS 2 kernel, modules (with 1.1), and firmware" || true
          git push || true
