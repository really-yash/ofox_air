name: Extract Kernel and Modules👨‍💻🦊 (Air)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full cpio lz4 erofs-utils
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
          sudo cp payload-dumper-go /usr/local/bin/
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip 'lib/x86_64/libmagiskboot.so'
          sudo mv lib/x86_64/libmagiskboot.so /usr/local/bin/magiskboot
          sudo chmod +x /usr/local/bin/magiskboot

      - name: Fast Download ROM
        run: |
          aria2c -x 16 -s 16 -k 1M --file-allocation=none -o rom.zip "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global-ota_full-OS2.0.208.0.VGQINXM-user-15.0-93391672cc.zip"
          unzip -q rom.zip payload.bin
          rm -f rom.zip

      - name: Dump Partitions
        run: |  
          set +e
          payload-dumper-go -o dumped_images -p boot,dtbo,vendor_dlkm,vendor payload.bin  
          rm -f payload.bin
          
          mkdir -p prebuilt
          cp dumped_images/dtbo.img prebuilt/dtbo.img || true
          
          cd dumped_images
          echo "1. Unpacking Boot for Kernel..."
          magiskboot unpack boot.img
          cp kernel ../prebuilt/kernel || true

      - name: Sniper Extraction (Modules & Firmware)
        run: |
          cd dumped_images
          
          echo "2. Preparing Clean Directories..."
          rm -rf ../recovery/root/lib/modules/*
          rm -rf ../recovery/root/vendor/lib/modules/1.1/*
          rm -rf ../recovery/root/vendor/firmware/*
          
          mkdir -p ../recovery/root/lib/modules
          mkdir -p ../recovery/root/vendor/lib/modules/1.1
          mkdir -p ../recovery/root/vendor/firmware
          
          echo "3. Ripping Modules from vendor_dlkm..."
          sudo mkdir -p /mnt/vendor_dlkm
          sudo mount -o loop,ro vendor_dlkm.img /mnt/vendor_dlkm 2>/dev/null || sudo mount -o loop,ro -t erofs vendor_dlkm.img /mnt/vendor_dlkm 2>/dev/null
          
          # Pull ALL .ko drivers into the root lib/modules directory
          find /mnt/vendor_dlkm -type f -name "*.ko" -exec cp {} ../recovery/root/lib/modules/ \; 2>/dev/null
          find /mnt/vendor_dlkm -type f -name "modules.load*" -exec cp {} ../recovery/root/lib/modules/ \; 2>/dev/null
          
          # Pull exact touch modules into vendor/lib/modules/1.1 matching your 15C layout
          find /mnt/vendor_dlkm -type f -name "*_tp.ko" -exec cp {} ../recovery/root/vendor/lib/modules/1.1/ \; 2>/dev/null
          find /mnt/vendor_dlkm -type f -name "*_ts.ko" -exec cp {} ../recovery/root/vendor/lib/modules/1.1/ \; 2>/dev/null
          find /mnt/vendor_dlkm -type f -name "nt36*.ko" -exec cp {} ../recovery/root/vendor/lib/modules/1.1/ \; 2>/dev/null
          find /mnt/vendor_dlkm -type f -name "xiaomi_*.ko" -exec cp {} ../recovery/root/vendor/lib/modules/1.1/ \; 2>/dev/null
          find /mnt/vendor_dlkm -type f -name "lct_*.ko" -exec cp {} ../recovery/root/vendor/lib/modules/1.1/ \; 2>/dev/null
          
          sudo umount /mnt/vendor_dlkm 2>/dev/null
          
          echo "4. Ripping Firmware from vendor.img..."
          sudo mkdir -p /mnt/vendor
          sudo mount -o loop,ro vendor.img /mnt/vendor 2>/dev/null || sudo mount -o loop,ro -t erofs vendor.img /mnt/vendor 2>/dev/null
          
          # STRICT filter: Only grab explicit touch bins/imgs and the MultipleTest ini config, avoiding camera AI files
          find /mnt/vendor/firmware -type f \( -iname "*_ts_*.bin" -o -iname "*_ts_*.img" -o -iname "*_ts_*.fw" -o -iname "Conf_MultipleTest.ini" -o -iname "focaltech_*.bin" -o -iname "novatek_*.bin" -o -iname "novatek_*.mp" -o -iname "omnivision_*.img" \) -exec cp {} ../recovery/root/vendor/firmware/ \; 2>/dev/null
          
          sudo umount /mnt/vendor 2>/dev/null

      - name: Commit Prebuilts, Modules, and Firmware
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prebuilt/
          git add recovery/root/lib/modules/ || true
          git add recovery/root/vendor/lib/modules/ || true
          git add recovery/root/vendor/firmware/ || true
          git commit -m "🦊 Auto-commit: Cleaned structure, modules in lib/modules, 1.1 touch modules, clean firmware" || true
          git push || true
